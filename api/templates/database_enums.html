<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Enum Types - I-TAT Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #1976d2;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #1976d2;
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .search-box {
            margin-bottom: 30px;
        }
        
        #search {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        
        #search:focus {
            outline: none;
            border-color: #1976d2;
        }
        
        .enum-section {
            margin-bottom: 40px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .enum-header {
            background: #1976d2;
            color: white;
            padding: 15px 20px;
            font-size: 20px;
            font-weight: 600;
        }
        
        .enum-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .enum-table th {
            background: #f5f5f5;
            padding: 12px 20px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .enum-table td {
            padding: 12px 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .enum-table tr:last-child td {
            border-bottom: none;
        }
        
        .enum-table tr:hover {
            background: #f9f9f9;
        }
        
        .enum-value {
            font-family: 'Courier New', monospace;
            color: #1976d2;
            font-weight: 600;
            font-size: 14px;
        }
        
        .enum-name {
            color: #666;
            font-size: 14px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: #e3f2fd;
            padding: 15px 20px;
            border-radius: 6px;
            border-left: 4px solid #1976d2;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #1976d2;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/admin/webhooks" class="back-link">← Back to Admin Panel</a>
        
        <h1>📋 Database Enum Types</h1>
        <p class="subtitle">Complete reference of all enum types used in the database schema</p>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="total-enums">0</div>
                <div class="stat-label">Total Enum Types</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-values">0</div>
                <div class="stat-label">Total Values</div>
            </div>
        </div>
        
        <div class="search-box">
            <input type="text" id="search" placeholder="🔍 Search enum types or values...">
        </div>
        
        <div id="enums-container"></div>
        <div id="no-results" class="no-results" style="display: none;">
            No enum types found matching your search.
        </div>
    </div>
    
    <script>
        const enumsData = {{ enums_json | safe }};
        
        function renderEnums(filterText = '') {
            const container = document.getElementById('enums-container');
            const noResults = document.getElementById('no-results');
            container.innerHTML = '';
            
            const filter = filterText.toLowerCase();
            let visibleCount = 0;
            let totalValues = 0;
            
            Object.keys(enumsData).forEach(enumName => {
                const enumValues = enumsData[enumName];
                
                // Filter enum
                const nameMatch = enumName.toLowerCase().includes(filter);
                const valueMatch = enumValues.some(v => 
                    v.name.toLowerCase().includes(filter) || 
                    v.value.toLowerCase().includes(filter)
                );
                
                if (!filter || nameMatch || valueMatch) {
                    visibleCount++;
                    totalValues += enumValues.length;
                    
                    const section = document.createElement('div');
                    section.className = 'enum-section';
                    
                    const header = document.createElement('div');
                    header.className = 'enum-header';
                    header.textContent = enumName;
                    section.appendChild(header);
                    
                    const table = document.createElement('table');
                    table.className = 'enum-table';
                    
                    const thead = document.createElement('thead');
                    thead.innerHTML = `
                        <tr>
                            <th>Value</th>
                            <th>Name</th>
                        </tr>
                    `;
                    table.appendChild(thead);
                    
                    const tbody = document.createElement('tbody');
                    enumValues.forEach(member => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td><span class="enum-value">${member.value}</span></td>
                            <td><span class="enum-name">${member.name}</span></td>
                        `;
                        tbody.appendChild(row);
                    });
                    table.appendChild(tbody);
                    
                    section.appendChild(table);
                    container.appendChild(section);
                }
            });
            
            // Update stats
            document.getElementById('total-enums').textContent = visibleCount;
            document.getElementById('total-values').textContent = totalValues;
            
            // Show/hide no results message
            if (visibleCount === 0) {
                container.style.display = 'none';
                noResults.style.display = 'block';
            } else {
                container.style.display = 'block';
                noResults.style.display = 'none';
            }
        }
        
        // Search functionality
        document.getElementById('search').addEventListener('input', (e) => {
            renderEnums(e.target.value);
        });
        
        // Initial render
        renderEnums();
    </script>
</body>
</html>
